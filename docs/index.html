<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dxwe — PORTFOLIO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <svg class="barcode" viewBox="0 0 60 18" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" width="2" height="18"/><rect x="4" width="1" height="18"/>
      <rect x="7" width="3" height="18"/><rect x="12" width="1" height="18"/>
      <rect x="15" width="2" height="18"/><rect x="19" width="4" height="18"/>
      <rect x="25" width="1" height="18"/><rect x="28" width="2" height="18"/>
      <rect x="32" width="1" height="18"/><rect x="35" width="3" height="18"/>
      <rect x="40" width="1" height="18"/><rect x="43" width="2" height="18"/>
      <rect x="47" width="1" height="18"/><rect x="50" width="4" height="18"/>
      <rect x="56" width="1" height="18"/><rect x="58" width="2" height="18"/>
    </svg>
    <span class="brand">dxwe</span>
  </div>
  <div class="topcenter mono dim">PORTFOLIO / SPATIAL MODE v3.1</div>
  <div class="topbar-right mono">
    <span id="clock">00:00:00</span>
    <span class="dim" id="count">IMG 00</span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="sphere" id="sphere"></div>
</main>

<div class="legend mono">
  <span>DRAG&nbsp;TO&nbsp;SPIN</span>
  <span>CLICK&nbsp;TO&nbsp;OPEN</span>
</div>

<div id="lightbox" hidden>
  <img alt="">
  <p class="mono" id="lightboxCaption"></p>
  <a class="mono" id="lightboxOriginal" target="_blank" rel="noopener">OPEN ORIGINAL &#8599;</a>
</div>

<div class="grain" aria-hidden="true"></div>

<script src="main.js"></script>
</body>
</html>
